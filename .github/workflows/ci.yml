name: QE Continuous Integration Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Dependencies
        run: npm install
      - name: Run Quality Gate 1 - Smoke Test
        run: npm run test:smoke

  regression-test:
    needs: smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Dependencies
        run: npm install
      - name: Run Quality Gate 2 - Automated Regression Test
        run: npm run test:regression
```[cite: 1]

4. Nhấn **Commit changes...** $\rightarrow$ **Commit changes** để lưu tệp[cite: 1].

---

## CHẶNG 4: THỰC HÀNH QUY TRÌNH COMMIT, FEATURE BRANCH & MERGE CODE[cite: 1]

### Bước 1: Tạo Nhánh mới (`Feature Branch`)[cite: 1]
* Tại trang chủ Repo, bấm vào ô chọn nhánh `main` $\rightarrow$ Nhập `feature/update-login` $\rightarrow$ Nhấn **Create branch: feature/update-login**[cite: 1].

### Bước 2: Commit thay đổi trên Feature Branch[cite: 1]
* Chuyển sang nhánh `feature/update-login`[cite: 1].
* Mở file `auth.js`, nhấn nút cây bút (**Edit**) để thêm 1 dòng comment: `// Feature update`[cite: 1].
* Nhấn **Commit changes...** (đảm bảo commit lưu ở nhánh `feature/update-login`)[cite: 1].

### Bước 3: Tạo Pull Request (PR) & Quan sát Smoke Test[cite: 1]
* Sang tab **Pull requests** $\rightarrow$ Bấm **New pull request**[cite: 1].
* Chọn so sánh: `base: main` $\leftarrow$ `compare: feature/update-login` $\rightarrow$ Bấm **Create pull request**[cite: 1].
* Quan sát ngay tại giao diện PR: GitHub Actions tự động kích hoạt **Quality Gate 1 (Smoke Test)**[cite: 1].

📸 **MỤC CẦN CHỤP ẢNH MINH CHỨNG 2:** Màn hình giao diện Pull Request cho thấy Quality Gate 1 (Smoke Test) tự động chạy thành công (Báo **tích xanh**)[cite: 1].

### Bước 4: Merge Code vào Main & Quan sát Regression Test[cite: 1]
* Khi Smoke Test báo tích xanh, nhấn **Merge pull request** $\rightarrow$ **Confirm merge**[cite: 1].
* Chuyển sang tab **Actions** trên thanh menu chính[cite: 1].
* Bạn sẽ thấy hệ thống tự động kích hoạt **Quality Gate 2 (Regression Test)** trên nhánh `main` sau khi merge thành công[cite: 1].

📸 **MỤC CẦN CHỤP ẢNH MINH CHỨNG 3:** Màn hình tab Actions cho thấy Quality Gate 2 (Regression Test) tự động chạy thành công (Báo **tích xanh**) trên nhánh `main`[cite: 1].

