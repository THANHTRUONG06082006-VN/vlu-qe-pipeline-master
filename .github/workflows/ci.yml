## CHẶNG 5: THỰC HÀNH BẪY LỖI & KHÔI PHỤC ĐƯỜNG ỐNG (FAIL FAST & FIX)[cite: 1]

### Bước 1: Cố tình làm hỏng Smoke Test (Fail Fast)[cite: 1]
1. Chuyển sang nhánh `feature/update-login`[cite: 1].
2. Mở file `auth.js`, sửa mật khẩu đúng từ `'123'` thành `'9999'` (cố tình tạo lỗi logic)[cite: 1].
3. Nhấn **Commit changes...**[cite: 1].
4. Tạo một **Pull Request** mới từ `feature/update-login` gửi vào `main`[cite: 1].
5. Kết quả: Tại giao diện PR, bài Smoke Test sẽ thất bại và báo **MÀU ĐỎ (Failed)**, đồng thời nút Merge bị cảnh báo/khóa[cite: 1].

📸 **MỤC CẦN CHỤP ẢNH MINH CHỨNG 4:** Màn hình Pull Request báo **MÀU ĐỎ (Failed)** do Smoke Test phát hiện lỗi logic (Minh chứng cơ chế Fail Fast trong < 1 phút)[cite: 1].

### Bước 2: Sửa lỗi & Khôi phục đường ống (Fix & Pass)[cite: 1]
1. Quay lại nhánh `feature/update-login`, mở file `auth.js` sửa mật khẩu lại thành đúng là `'123'`[cite: 1].
2. Nhấn **Commit changes...**[cite: 1].
3. Quay lại trang Pull Request trước đó, Smoke Test sẽ tự động chạy lại và báo **TÍCH XANH (Passed)**[cite: 1].
4. Tiến hành nhấn **Merge pull request** $\rightarrow$ **Confirm merge**[cite: 1].
5. Vào tab **Actions** kiểm tra Regression Test trên nhánh `main` tiếp tục được kích hoạt và báo tích xanh hoàn toàn[cite: 1].

📸 **MỤC CẦN CHỤP ẢNH MINH CHỨNG 5:** Màn hình khôi phục thành công về **MÀU XANH (Passed)** sau khi sửa code và Merge vào main[cite: 1].

