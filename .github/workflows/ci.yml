name: QE Continuous Integration Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Dependencies
        run: npm install
      - name: Run Quality Gate 1 - Smoke Test
        run: npm run test:smoke

  regression-test:
    needs: smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Dependencies
        run: npm install
      - name: Run Quality Gate 2 - Automated Regression Test
        run: npm run test:regression
```[cite: 1]
* **Bước 3: Lưu file**[cite: 1]
  * Nhấn **Commit changes...** $\rightarrow$ chọn **Commit directly to the `main` branch** $\rightarrow$ Nhấn **Commit changes**[cite: 1].

Chặng này thực hành đúng quy trình làm việc chuẩn trong dự án phần mềm: Tạo nhánh tính năng $\rightarrow$ Đẩy code $\rightarrow$ Kiểm tra tự động trên Pull Request $\rightarrow$ Merge vào nhánh chính[cite: 1].


* Tại trang chủ Repo, nhấn vào nút dropdown chọn nhánh đang ghi **`main`** (phía trên danh sách tệp, bên trái)[cite: 1].
* Gõ tên nhánh mới: `feature/update-login`[cite: 1].
* Bấm vào dòng chữ **Create branch: feature/update-login from 'main'** xuất hiện ở bên dưới[cite: 1].

### 2. Thực hiện Commit thay đổi trên Feature Branch
* Đảm bảo ô chọn nhánh đang hiển thị **`feature/update-login`**[cite: 1].
* Nhấn mở tệp `auth.js` $\rightarrow$ Click vào biểu tượng **cây bút (Edit this file)** ở góc trên bên phải[cite: 1].
* Thêm một dòng ghi chú comment nhỏ ở đầu file:
  ```javascript
  // Update login feature for Lab01
